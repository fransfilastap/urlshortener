<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{{.ErrorCode}} — {{.ErrorTitle}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-eggshell: #fdfcfc;
            --color-powder: #f5f3f1;
            --color-chalk: #e5e5e5;
            --color-fog: #b1b0b0;
            --color-gravel: #777169;
            --color-slate: #a59f97;
            --color-obsidian: #000000;
            --color-signal-blue: #0447ff;
            --font-waldenburg: 'Cormorant Garamond', ui-serif, Georgia, serif;
            --font-inter: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --text-caption: 10px;
            --text-body: 14px;
            --text-body-lg: 16px;
            --text-heading-sm: 20px;
            --text-heading: 32px;
            --text-heading-lg: 36px;
            --text-display: 48px;
            --spacing-8: 8px;
            --spacing-12: 12px;
            --spacing-16: 16px;
            --spacing-20: 20px;
            --spacing-24: 24px;
            --spacing-28: 28px;
            --spacing-32: 32px;
            --spacing-40: 40px;
            --spacing-48: 48px;
            --spacing-56: 56px;
            --spacing-64: 64px;
            --spacing-72: 72px;
            --spacing-96: 96px;
            --radius-cards: 16px;
            --shadow-card: rgba(0, 0, 0, 0.4) 0px 0px 1.143px 0px, rgba(0, 0, 0, 0.04) 0px 2px 4px 0px;
            --shadow-button: rgba(0, 0, 0, 0.06) 0px 0px 0px 1px, rgba(0, 0, 0, 0.04) 0px 1px 2px, rgba(0, 0, 0, 0.04) 0px 2px 4px;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

        body {
            font-family: var(--font-inter);
            background: var(--color-eggshell);
            color: var(--color-obsidian);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .error-card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: var(--radius-cards);
            padding: var(--spacing-40);
            margin: var(--spacing-24);
            box-shadow: var(--shadow-card);
            animation: cardReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(12px);
        }

        @keyframes cardReveal {
            to { opacity: 1; transform: translateY(0); }
        }

        .error-code {
            font-family: var(--font-waldenburg);
            font-size: var(--text-display);
            font-weight: 300;
            line-height: 1.08;
            letter-spacing: -0.96px;
            color: var(--color-obsidian);
            margin-bottom: var(--spacing-8);
            animation: codeReveal 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
            opacity: 0;
            transform: translateY(8px);
        }

        @keyframes codeReveal {
            to { opacity: 1; transform: translateY(0); }
        }

        .error-title {
            font-family: var(--font-inter);
            font-size: var(--text-heading-sm);
            font-weight: 500;
            line-height: 1.4;
            color: var(--color-obsidian);
            margin-bottom: var(--spacing-12);
            animation: titleReveal 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
            opacity: 0;
            transform: translateY(8px);
        }

        @keyframes titleReveal {
            to { opacity: 1; transform: translateY(0); }
        }

        .error-message {
            font-family: var(--font-inter);
            font-size: var(--text-body-lg);
            font-weight: 400;
            line-height: 1.5;
            color: var(--color-gravel);
            max-width: 48ch;
            animation: msgReveal 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
            opacity: 0;
            transform: translateY(8px);
        }

        @keyframes msgReveal {
            to { opacity: 1; transform: translateY(0); }
        }

        .divider {
            width: 100%;
            height: 1px;
            background: var(--color-chalk);
            margin: var(--spacing-24) 0;
            animation: dividerReveal 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
            opacity: 0;
        }

        @keyframes dividerReveal {
            to { opacity: 1; }
        }

        .error-meta {
            font-family: var(--font-inter);
            font-size: var(--text-caption);
            color: var(--color-fog);
            animation: metaReveal 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
            opacity: 0;
        }

        @keyframes metaReveal {
            to { opacity: 1; }
        }

        .error-meta .domain {
            color: var(--color-obsidian);
            font-weight: 500;
        }

        @media (max-width: 640px) {
            .error-card { padding: var(--spacing-24); }
            .error-code { font-size: var(--text-heading-lg); letter-spacing: -0.72px; }
        }
    </style>
</head>
<body>
    <div class="error-card" role="alert">
        <div class="error-code">{{.ErrorCode}}</div>
        <h1 class="error-title">{{.ErrorTitle}}</h1>
        <p class="error-message">{{.ErrorMessage}}</p>
        <div class="divider" aria-hidden="true"></div>
        <div class="error-meta"><span class="domain">s.bphn.go.id</span></div>
    </div>
</body>
</html>
